#########################################################################
# Lab: ECS Fargate deploy image compression benchmark                   #
# A/B test — arm "legacy": docker build cổ điển, layer nén gzip mặc định #
# Chạy song song với lab-build-zstd.yml (cùng cluster, service RIÊNG) để so: #
#   1) thời gian build+push image lên ECR                               #
#   2) thời gian ECS Fargate task PENDING → STABLE (pull + unpack)       #
#                                                                         #
# Yêu cầu chuẩn bị trước (repo Settings → Secrets and variables → Actions): #
#   secrets.AWS_ACCESS_KEY_ID     - access key của IAM User (vd tofu)    #
#   secrets.AWS_SECRET_ACCESS_KEY - secret key tương ứng                 #
# Các giá trị môi trường khác (region, ECR/ECS name) đã set cứng ở khối  #
# `env:` bên dưới — sửa trực tiếp trong file này nếu đổi tài nguyên lab. #
# Lưu ý: IAM User dùng access key dài hạn — chỉ hợp lý cho lab cá nhân,  #
# KHÔNG khuyến nghị cho production (nên dùng OIDC role-based auth).      #
# Xem thêm: W:\ecs-research\ecs-fargate-deploy-optimization.html         #
#########################################################################

name: "[🧪] LAB - ECS Image Perf Test (Legacy gzip build)"

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY_NAME: lab/lab-ecs
  ECS_CLUSTER_NAME: labtest
  ECS_SERVICE_NAME: ecs-lab-perf-test-legacy

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      IMAGE_URI: ${{ steps.vars.outputs.IMAGE_URI }}
      LATEST_URI: ${{ steps.vars.outputs.LATEST_URI }}
      BUILD_PUSH_SECONDS: ${{ steps.build_push.outputs.BUILD_PUSH_SECONDS }}
    steps:
      # Checkout repo so the lab Dockerfile and task definition are available.
      - name: "📥 Checkout repo"
        uses: actions/checkout@v4

      # Auth bằng access key của IAM User (lab cá nhân) — không dùng OIDC/role-assumption.
      - name: "🔐 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR — action này tự docker login, không cần gọi thủ công.
      - name: "🔑 Login to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Resolve the lab image URI for this run — "legacy" suffix keeps it separate from the zstd run.
      # Tag số theo run_number là bất biến (lịch sử từng lần chạy); LATEST_URI là con trỏ nổi,
      # luôn được ghi đè để trỏ tới bản build gần nhất của arm này — tiện tham chiếu nhanh.
      - name: "🧭 Resolve lab image URI"
        id: vars
        run: |
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:lab-legacy-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "LATEST_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:lab-legacy-latest" >> "$GITHUB_OUTPUT"

      # GitHub-hosted runner có disk nhỏ hơn self-hosted runner nội bộ — image lab ~3.4GB nên
      # dọn bớt tool cài sẵn (dotnet/android/haskell) để chắc chắn còn đủ chỗ build+push.
      - name: "🧹 Free up runner disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true

      # Build with the classic (pre-BuildKit) builder — default gzip layer compression.
      # Timed as one block (build+push) so it's directly comparable with the zstd job, where BuildKit's
      # image exporter fuses build+compress+push into a single step and cannot be split the same way.
      - name: "🐳 Build and push image (legacy builder, gzip) — timed"
        id: build_push
        working-directory: ./lab
        run: |
          START=$(date +%s)

          DOCKER_BUILDKIT=0 docker build \
            -f Dockerfile \
            -t "${{ steps.vars.outputs.IMAGE_URI }}" \
            .
          docker push "${{ steps.vars.outputs.IMAGE_URI }}"

          END=$(date +%s)
          echo "BUILD_PUSH_SECONDS=$((END - START))" >> "$GITHUB_OUTPUT"
          echo "📦 Build+push duration: $((END - START))s"

      # Tag + push thêm "-latest" trỏ tới digest vừa build — chung digest với tag số nên
      # ECR lifecycle policy (xem ecr/lifecycle-policy.json) không tính đây là image thứ 2.
      - name: "🏷️ Tag as lab-legacy-latest"
        run: |
          docker tag "${{ steps.vars.outputs.IMAGE_URI }}" "${{ steps.vars.outputs.LATEST_URI }}"
          docker push "${{ steps.vars.outputs.LATEST_URI }}"

      # Remove local images to free space on the runner.
      - name: "🧹 Clean up local image"
        if: always()
        run: |
          docker rmi "${{ steps.vars.outputs.IMAGE_URI }}" || true
          docker rmi "${{ steps.vars.outputs.LATEST_URI }}" || true

      # Report the compressed size actually stored in ECR — compare against the zstd run's size.
      - name: "📏 Report image size in ECR"
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY_NAME }}" \
            --image-ids imageTag="lab-legacy-${{ github.run_number }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'imageDetails[0].imageSizeInBytes' \
            --no-cli-pager

      # Đọc thẳng manifest trên registry — cho biết chính xác bao nhiêu layer, media type
      # (tar.gzip vs tar+zstd) và size nén của TỪNG layer, không chỉ tổng số như bước trên.
      - name: "🖼️ Inspect image layers (media type + size per layer)"
        run: |
          docker buildx imagetools inspect "${{ steps.vars.outputs.IMAGE_URI }}" --raw > manifest.json

          LAYER_COUNT=$(jq '.layers | length' manifest.json)
          TOTAL_BYTES=$(jq '[.layers[].size] | add' manifest.json)
          TOTAL_MB=$(awk "BEGIN {printf \"%.1f\", $TOTAL_BYTES/1024/1024}")

          {
            echo ""
            echo "### 🖼️ Image layer breakdown — Legacy gzip build"
            echo ""
            echo "| # | Media type | Size |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          jq -r '.layers | to_entries[] | "\(.key+1)|\(.value.mediaType)|\(.value.size)"' manifest.json | \
          while IFS='|' read -r idx mtype size; do
            size_mb=$(awk "BEGIN {printf \"%.1f\", $size/1024/1024}")
            echo "| $idx | \`$mtype\` | ${size_mb} MB |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tổng: $LAYER_COUNT layer, ${TOTAL_MB} MB (nén, đúng dung lượng lưu trong ECR)**" >> "$GITHUB_STEP_SUMMARY"

  Deploy:
    needs: [Build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout repo because the task definition is stored here.
      - name: "📥 Checkout repo"
        uses: actions/checkout@v4

      # Auth bằng access key của IAM User — mỗi job chạy trên runner riêng nên phải cấu hình lại.
      - name: "🔐 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Update task definition JSON so ECS deploys the newly pushed lab image.
      - name: "🧩 Update task definition image"
        working-directory: ./ecs
        run: |
          echo "Current Task Definition"
          cat "ecs-lab-perf-test-legacy.json"

          jq --arg IMAGE "${{ needs.Build.outputs.IMAGE_URI }}" \
             --arg NAME "ecs-lab-perf-test-legacy" \
          '.containerDefinitions |= map(
            if .name == $NAME
            then .image = $IMAGE
            else .
            end
          )' "ecs-lab-perf-test-legacy.json" > new-task-def.json

          echo "New Task Definition"
          cat new-task-def.json

      # Register the updated task definition and expose ARN to later steps.
      - name: "📝 Register new task definition"
        working-directory: ./ecs
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --region "${{ env.AWS_REGION }}" \
            --output text \
            --no-cli-pager)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"
          echo "$TASK_DEF_ARN"

      # Deploy + wait, timed as ONE block — this is the metric the zstd/SOCI research targets:
      # Fargate task PENDING time is dominated by image pull + unpack, not by app init.
      # platform-version pinned to 1.4+ because zstd/SOCI both require containerd (PV 1.4+).
      # deployment-configuration min=0/max=200 cho phép ECS dừng task cũ + khởi động task mới
      # CÙNG LÚC (thay vì mặc định min=100 bắt phải chờ task mới healthy rồi mới dừng task cũ) —
      # chỉ hợp lý cho lab test (chấp nhận downtime ngắn), KHÔNG dùng cho production có traffic thật.
      - name: "🚀 Deploy ECS service and measure time-to-stable"
        run: |
          START=$(date +%s)

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --service "${{ env.ECS_SERVICE_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --task-definition "$TASK_DEF_ARN" \
            --desired-count 1 \
            --platform-version "1.4.0" \
            --deployment-configuration "minimumHealthyPercent=0,maximumPercent=200" \
            --no-cli-pager

          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --service "${{ env.ECS_SERVICE_NAME }}" \
            --no-cli-pager

          END=$(date +%s)
          echo "DEPLOY_STABLE_SECONDS=$((END - START))" >> "$GITHUB_ENV"
          echo "⏱️ Time to stable: $((END - START))s"

      # aws ecs wait chỉ poll mỗi 15s (nhiễu ±15s) và đo CẢ rollout/drain task cũ, không chỉ pull.
      # Timestamp dưới đây do chính ECS agent ghi lại — tách riêng đúng giai đoạn pull+unpack,
      # là con số tương ứng trực tiếp với benchmark zstd/SOCI của AWS (không lẫn overhead khác).
      - name: "📊 Fetch ECS task timeline breakdown"
        run: |
          TASK_ARN=$(aws ecs list-tasks \
            --region "${{ env.AWS_REGION }}" \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --service-name "${{ env.ECS_SERVICE_NAME }}" \
            --query 'taskArns[0]' --output text)

          read -r CREATED CONN PULL_START PULL_STOP STARTED <<< "$(aws ecs describe-tasks \
            --region "${{ env.AWS_REGION }}" \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].[createdAt,connectivityAt,pullStartedAt,pullStoppedAt,startedAt]' \
            --output text)"

          to_epoch() { date -d "$1" +%s.%N; }

          T_CREATED=$(to_epoch "$CREATED")
          T_CONN=$(to_epoch "$CONN")
          T_PULL_START=$(to_epoch "$PULL_START")
          T_PULL_STOP=$(to_epoch "$PULL_STOP")
          T_STARTED=$(to_epoch "$STARTED")

          NETWORK_SETUP=$(awk "BEGIN {printf \"%.1f\", $T_CONN - $T_CREATED}")
          AGENT_INIT=$(awk "BEGIN {printf \"%.1f\", $T_PULL_START - $T_CONN}")
          PULL_DURATION=$(awk "BEGIN {printf \"%.1f\", $T_PULL_STOP - $T_PULL_START}")
          CONTAINER_INIT=$(awk "BEGIN {printf \"%.1f\", $T_STARTED - $T_PULL_STOP}")
          TOTAL_LAUNCH=$(awk "BEGIN {printf \"%.1f\", $T_STARTED - $T_CREATED}")

          echo "PULL_DURATION_SECONDS=$PULL_DURATION" >> "$GITHUB_ENV"
          echo "TOTAL_LAUNCH_SECONDS=$TOTAL_LAUNCH" >> "$GITHUB_ENV"

          {
            echo ""
            echo "### ⏱️ ECS task timeline breakdown — Legacy gzip build"
            echo "_(timestamp từ ECS agent, không qua wait-polling)_"
            echo ""
            echo "| Giai đoạn | Thời gian |"
            echo "| --- | --- |"
            echo "| Created → Connectivity (ENI attach) | ${NETWORK_SETUP}s |"
            echo "| Connectivity → Pull start (agent init) | ${AGENT_INIT}s |"
            echo "| **Pull start → Pull stop (kéo + giải nén image)** | **${PULL_DURATION}s** |"
            echo "| Pull stop → Started (container init) | ${CONTAINER_INIT}s |"
            echo "| **Tổng Created → Started (task launch thật)** | **${TOTAL_LAUNCH}s** |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Write a step summary so this run is easy to compare against the zstd lab run.
      - name: "🧾 Report lab result"
        run: |
          {
            echo ""
            echo "### 🧪 Lab result — Legacy gzip build"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Image URI (tag theo run, bất biến) | \`${{ needs.Build.outputs.IMAGE_URI }}\` |"
            echo "| Latest tag (con trỏ nổi) | \`${{ needs.Build.outputs.LATEST_URI }}\` |"
            echo "| Build+push duration | ${{ needs.Build.outputs.BUILD_PUSH_SECONDS }}s |"
            echo "| Deploy → stable duration (wall-clock, gồm rollout+drain+polling) | ${DEPLOY_STABLE_SECONDS}s |"
            echo "| Pull start → stop duration (chuẩn, từ ECS agent) | ${PULL_DURATION_SECONDS}s |"
            echo "| Task launch total (Created → Started) | ${TOTAL_LAUNCH_SECONDS}s |"
          } >> "$GITHUB_STEP_SUMMARY"
