#########################################################################
# Lab: ECS Fargate deploy image compression benchmark                   #
# A/B test — arm "legacy": docker build cổ điển, layer nén gzip mặc định #
# Chạy song song với lab-build-zstd.yml (cùng cluster/service) để so:    #
#   1) thời gian build+push image lên ECR                               #
#   2) thời gian ECS Fargate task PENDING → STABLE (pull + unpack)       #
#                                                                         #
# Yêu cầu chuẩn bị trước (repo Settings → Secrets and variables):        #
#   secrets.AWS_ROLE_ARN     - IAM role có trust policy cho GitHub OIDC  #
#   vars.AWS_REGION          - vd "ap-southeast-1"                      #
#   vars.ECR_REPOSITORY_NAME - tên ECR repository đã tạo sẵn             #
#   vars.ECS_CLUSTER_NAME    - tên ECS cluster (Fargate)                 #
#   vars.ECS_SERVICE_NAME    - tên ECS service, task family = ecs-lab-perf-test #
# Xem thêm: W:\ecs-research\ecs-fargate-deploy-optimization.html         #
#########################################################################

name: "[🧪] LAB - ECS Image Perf Test (Legacy gzip build)"

on:
  workflow_dispatch:

# Bắt buộc cho OIDC (aws-actions/configure-aws-credentials) — thay cho custom
# assume-role action + external-id chỉ dùng nội bộ trước đây.
permissions:
  id-token: write
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      IMAGE_URI: ${{ steps.vars.outputs.IMAGE_URI }}
      BUILD_PUSH_SECONDS: ${{ steps.build_push.outputs.BUILD_PUSH_SECONDS }}
    steps:
      # Checkout repo so the lab Dockerfile and task definition are available.
      - name: "📥 Checkout repo"
        uses: actions/checkout@v4

      # Assume AWS role via GitHub OIDC — không cần lưu access key dài hạn trong secrets.
      - name: "🔐 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Login to ECR — action này tự docker login, không cần gọi thủ công.
      - name: "🔑 Login to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Resolve the lab image URI for this run — "legacy" suffix keeps it separate from the zstd run.
      - name: "🧭 Resolve lab image URI"
        id: vars
        run: |
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:lab-legacy-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # GitHub-hosted runner có disk nhỏ hơn self-hosted runner nội bộ — image lab ~3.4GB nên
      # dọn bớt tool cài sẵn (dotnet/android/haskell) để chắc chắn còn đủ chỗ build+push.
      - name: "🧹 Free up runner disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true

      # Build with the classic (pre-BuildKit) builder — default gzip layer compression.
      # Timed as one block (build+push) so it's directly comparable with the zstd job, where BuildKit's
      # image exporter fuses build+compress+push into a single step and cannot be split the same way.
      - name: "🐳 Build and push image (legacy builder, gzip) — timed"
        id: build_push
        working-directory: ./lab
        run: |
          START=$(date +%s)

          DOCKER_BUILDKIT=0 docker build \
            -f Dockerfile \
            -t "${{ steps.vars.outputs.IMAGE_URI }}" \
            .
          docker push "${{ steps.vars.outputs.IMAGE_URI }}"

          END=$(date +%s)
          echo "BUILD_PUSH_SECONDS=$((END - START))" >> "$GITHUB_OUTPUT"
          echo "📦 Build+push duration: $((END - START))s"

      # Remove local image to free space on the runner.
      - name: "🧹 Clean up local image"
        if: always()
        run: docker rmi "${{ steps.vars.outputs.IMAGE_URI }}" || true

      # Report the compressed size actually stored in ECR — compare against the zstd run's size.
      - name: "📏 Report image size in ECR"
        run: |
          aws ecr describe-images \
            --repository-name "${{ vars.ECR_REPOSITORY_NAME }}" \
            --image-ids imageTag="lab-legacy-${{ github.run_number }}" \
            --region "${{ vars.AWS_REGION }}" \
            --query 'imageDetails[0].imageSizeInBytes' \
            --no-cli-pager

  Deploy:
    needs: [Build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout repo because the task definition is stored here.
      - name: "📥 Checkout repo"
        uses: actions/checkout@v4

      # Assume AWS role in deploy job too — each job runs on a fresh runner with isolated credentials.
      - name: "🔐 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Update task definition JSON so ECS deploys the newly pushed lab image.
      - name: "🧩 Update task definition image"
        working-directory: ./ecs
        run: |
          echo "Current Task Definition"
          cat "ecs-lab-perf-test.json"

          jq --arg IMAGE "${{ needs.Build.outputs.IMAGE_URI }}" \
             --arg NAME "ecs-lab-perf-test" \
          '.containerDefinitions |= map(
            if .name == $NAME
            then .image = $IMAGE
            else .
            end
          )' "ecs-lab-perf-test.json" > new-task-def.json

          echo "New Task Definition"
          cat new-task-def.json

      # Register the updated task definition and expose ARN to later steps.
      - name: "📝 Register new task definition"
        working-directory: ./ecs
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --region "${{ vars.AWS_REGION }}" \
            --output text \
            --no-cli-pager)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"
          echo "$TASK_DEF_ARN"

      # Deploy + wait, timed as ONE block — this is the metric the zstd/SOCI research targets:
      # Fargate task PENDING time is dominated by image pull + unpack, not by app init.
      # platform-version pinned to 1.4+ because zstd/SOCI both require containerd (PV 1.4+).
      - name: "🚀 Deploy ECS service and measure time-to-stable"
        run: |
          START=$(date +%s)

          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --service "${{ vars.ECS_SERVICE_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --task-definition "$TASK_DEF_ARN" \
            --desired-count 1 \
            --platform-version "1.4.0" \
            --no-cli-pager

          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}" \
            --service "${{ vars.ECS_SERVICE_NAME }}" \
            --no-cli-pager

          END=$(date +%s)
          echo "DEPLOY_STABLE_SECONDS=$((END - START))" >> "$GITHUB_ENV"
          echo "⏱️ Time to stable: $((END - START))s"

      # Write a step summary so this run is easy to compare against the zstd lab run.
      - name: "🧾 Report lab result"
        run: |
          {
            echo "### 🧪 Lab result — Legacy gzip build"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Image URI | \`${{ needs.Build.outputs.IMAGE_URI }}\` |"
            echo "| Build+push duration | ${{ needs.Build.outputs.BUILD_PUSH_SECONDS }}s |"
            echo "| Deploy → stable duration | ${DEPLOY_STABLE_SECONDS}s |"
          } >> "$GITHUB_STEP_SUMMARY"
