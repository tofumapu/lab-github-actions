#########################################################################
# Lab: ECS Fargate deploy image compression benchmark                   #
# A/B test — arm "zstd": buildx build, layer nén zstd (compression-level 3) #
# Chạy song song với lab-build-legacy-gzip.yml (cùng cluster, service RIÊNG) để so: #
#   1) thời gian build+push image lên ECR                               #
#   2) thời gian ECS Fargate task PENDING → STABLE (pull + unpack)       #
#                                                                         #
# Yêu cầu chuẩn bị trước (repo Settings → Secrets and variables → Actions): #
#   secrets.AWS_ACCESS_KEY_ID     - access key của IAM User (vd tofu)    #
#   secrets.AWS_SECRET_ACCESS_KEY - secret key tương ứng                 #
# Các giá trị môi trường khác (region, ECR/ECS name) đã set cứng ở khối  #
# `env:` bên dưới — sửa trực tiếp trong file này nếu đổi tài nguyên lab. #
# Yêu cầu: Fargate Platform Version 1.4+ (containerd) để runtime nhận    #
# diện layer zstd — xem W:\ecs-research\ecs-fargate-deploy-optimization.html #
# Lưu ý: IAM User dùng access key dài hạn — chỉ hợp lý cho lab cá nhân,  #
# KHÔNG khuyến nghị cho production (nên dùng OIDC role-based auth).      #
#########################################################################

name: "[🧪] LAB - ECS Image Perf Test (zstd compression build)"

on:
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY_NAME: lab/lab-ecs
  ECS_CLUSTER_NAME: labtest
  ECS_SERVICE_NAME: ecs-lab-perf-test-zstd

jobs:
  Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      IMAGE_URI: ${{ steps.vars.outputs.IMAGE_URI }}
      BUILD_PUSH_SECONDS: ${{ steps.build_push.outputs.BUILD_PUSH_SECONDS }}
    steps:
      # Checkout repo so the lab Dockerfile and task definition are available.
      - name: "📥 Checkout repo"
        uses: actions/checkout@v4

      # Auth bằng access key của IAM User (lab cá nhân) — không dùng OIDC/role-assumption.
      - name: "🔐 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR — action này tự docker login, không cần gọi thủ công.
      - name: "🔑 Login to Amazon ECR"
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Resolve the lab image URI for this run — "zstd" suffix keeps it separate from the legacy run.
      - name: "🧭 Resolve lab image URI"
        id: vars
        run: |
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}:lab-zstd-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # GitHub-hosted runner có disk nhỏ hơn self-hosted runner nội bộ — image lab ~3.4GB nên
      # dọn bớt tool cài sẵn (dotnet/android/haskell) để chắc chắn còn đủ chỗ build+push.
      - name: "🧹 Free up runner disk space"
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          docker system prune -af || true

      # zstd + OCI media types requires the docker-container driver — the default "docker" driver
      # cannot export custom compression straight to a registry the same way. Legacy builder has
      # no equivalent step, which is exactly the extra setup cost zstd adds to the pipeline.
      - name: "🏗️ Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # Build and push in one step — BuildKit's image exporter fuses build+compress+push, so unlike
      # the legacy job this cannot be split into separate "build" then "push" commands.
      # provenance/sbom disabled to keep the comparison focused on layer compression only.
      - name: "🐳 Build and push image (buildx, zstd compression) — timed"
        id: build_push
        working-directory: ./lab
        run: |
          START=$(date +%s)

          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile \
            --tag "${{ steps.vars.outputs.IMAGE_URI }}" \
            --output type=image,push=true,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true \
            --provenance=false --sbom=false .

          END=$(date +%s)
          echo "BUILD_PUSH_SECONDS=$((END - START))" >> "$GITHUB_OUTPUT"
          echo "📦 Build+push duration: $((END - START))s"

      # Report the compressed size actually stored in ECR — compare against the legacy run's size.
      - name: "📏 Report image size in ECR"
        run: |
          aws ecr describe-images \
            --repository-name "${{ env.ECR_REPOSITORY_NAME }}" \
            --image-ids imageTag="lab-zstd-${{ github.run_number }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'imageDetails[0].imageSizeInBytes' \
            --no-cli-pager

  Deploy:
    needs: [Build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Checkout repo because the task definition is stored here.
      - name: "📥 Checkout repo"
        uses: actions/checkout@v4

      # Auth bằng access key của IAM User — mỗi job chạy trên runner riêng nên phải cấu hình lại.
      - name: "🔐 Configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Update task definition JSON so ECS deploys the newly pushed lab image.
      - name: "🧩 Update task definition image"
        working-directory: ./ecs
        run: |
          echo "Current Task Definition"
          cat "ecs-lab-perf-test-zstd.json"

          jq --arg IMAGE "${{ needs.Build.outputs.IMAGE_URI }}" \
             --arg NAME "ecs-lab-perf-test-zstd" \
          '.containerDefinitions |= map(
            if .name == $NAME
            then .image = $IMAGE
            else .
            end
          )' "ecs-lab-perf-test-zstd.json" > new-task-def.json

          echo "New Task Definition"
          cat new-task-def.json

      # Register the updated task definition and expose ARN to later steps.
      - name: "📝 Register new task definition"
        working-directory: ./ecs
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --region "${{ env.AWS_REGION }}" \
            --output text \
            --no-cli-pager)

          echo "TASK_DEF_ARN=$TASK_DEF_ARN" >> "$GITHUB_ENV"
          echo "$TASK_DEF_ARN"

      # Deploy + wait, timed as ONE block — same methodology as the legacy lab job, so the two
      # numbers are directly comparable. platform-version pinned to 1.4+ (required for zstd/SOCI).
      - name: "🚀 Deploy ECS service and measure time-to-stable"
        run: |
          START=$(date +%s)

          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --service "${{ env.ECS_SERVICE_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --task-definition "$TASK_DEF_ARN" \
            --desired-count 1 \
            --platform-version "1.4.0" \
            --no-cli-pager

          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            --service "${{ env.ECS_SERVICE_NAME }}" \
            --no-cli-pager

          END=$(date +%s)
          echo "DEPLOY_STABLE_SECONDS=$((END - START))" >> "$GITHUB_ENV"
          echo "⏱️ Time to stable: $((END - START))s"

      # Write a step summary so this run is easy to compare against the legacy gzip lab run.
      - name: "🧾 Report lab result"
        run: |
          {
            echo "### 🧪 Lab result — zstd compression build"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Image URI | \`${{ needs.Build.outputs.IMAGE_URI }}\` |"
            echo "| Build+push duration | ${{ needs.Build.outputs.BUILD_PUSH_SECONDS }}s |"
            echo "| Deploy → stable duration | ${DEPLOY_STABLE_SECONDS}s |"
          } >> "$GITHUB_STEP_SUMMARY"
